# Workaround for https://github.com/conda-forge/opencv-feedstock/issues/493
MACOSX_SDK_VERSION:  # [osx]
  - 15.5             # [osx]

# cuDNN 9 needs glibc 2.28; align with the global CPU/CUDA 12/CUDA 13 compiler zip.
c_stdlib_version:  # [linux64]
  - 2.17          # [linux64]
  - 2.28          # [linux64]
  - 2.28          # [linux64]

qt_version:
  - none
  - 6          # [not ppc64le]
